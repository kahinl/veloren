[package]
name = "veloren-android"
version = "0.1.0"
edition = "2024"

[lib]
name = "veloren_android"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
once_cell = "1.19"
futures-util = "0.3"
veloren-common = { path = "../common", features = ["no-assets"] }
veloren-client = { path = "../client" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
vek = { version = "0.17", features = ["serde", "mint"] }

# wgpu renderer for Android
wgpu = "22"

# Android NDK asset access
assets_manager = "0.13"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.6"
ndk-sys = "0.6"
